# VIH VoiceRAG: single-VM production stack. Runbook: docs/DEPLOY.md.
#
# Always run from the repo root with the production env file (it supplies DOMAIN, POSTGRES_* etc.
# for interpolation below, and the app reads it via env_file):
#
#   docker compose -f deploy/docker-compose.yml --env-file .env.production <command>
#
# Only Caddy publishes ports (80/443). Postgres, Ollama, whisper.cpp, Piper and the app are reachable
# only on the internal networks. db, stt and tts sit on an `internal` network with no route to the
# internet at all, so audio, text and data cannot leave the VM from those containers.
#
# Rough steady-state memory (CPU-only VM): db ~0.3-1 GB, ollama + nomic-embed-text ~0.6 GB,
# stt base.en ~0.4 GB (small.en ~1 GB), tts ~0.3 GB, app ~0.5-1 GB, caddy <0.1 GB.
# Limits below leave headroom on an 8 GB VM; raise them on bigger hosts.

name: vih-voicerag

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-image: &app-image vih-voicerag-app:local

services:
  db:
    image: pgvector/pgvector:0.8.1-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voicerag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-vih_voicerag}
    volumes:
      - db-data:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 1536m
    logging: *logging

  ollama:
    # Embeddings only (nomic-embed-text, CPU). The LLM is Gemini, so no chat model is pulled here.
    image: ollama/ollama:0.34.4
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    # `internal` for the app; `edge` gives the model registry egress for `ollama pull`.
    networks: [internal, edge]
    deploy:
      resources:
        limits:
          memory: 2g
    logging: *logging

  # One-shot: download the embedding model into the ollama-models volume (idempotent, re-run after
  # changing EMBED_MODEL):  docker compose ... run --rm ollama-pull
  ollama-pull:
    image: ollama/ollama:0.34.4
    profiles: ["tools"]
    entrypoint: ["/bin/ollama"]
    command: ["pull", "${EMBED_MODEL:-nomic-embed-text}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  stt:
    build:
      context: ..
      dockerfile: deploy/stt.Dockerfile
      args:
        WHISPER_CPP_VERSION: v1.8.2
    image: vih-voicerag-stt:local
    restart: unless-stopped
    environment:
      # Decoder threads; set to the number of physical cores you can spare (whisper is CPU-bound).
      WHISPER_THREADS: ${WHISPER_THREADS:-4}
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 2g
    logging: *logging

  tts:
    build:
      context: ..
      dockerfile: deploy/tts.Dockerfile
    image: vih-voicerag-tts:local
    restart: unless-stopped
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 1g
    logging: *logging

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: *app-image
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    # required: false only so `docker compose config` can be validated against the example file.
    # In practice the file must exist: --env-file .env.production fails without it, and the app
    # refuses to start without DATABASE_URL.
    env_file:
      - path: ../.env.production
        required: false
    volumes:
      - app-storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
      stt:
        condition: service_healthy
      tts:
        condition: service_healthy
    # `internal` for db and sidecars; `edge` for Caddy and outbound HTTPS to the Gemini API.
    networks: [internal, edge]
    deploy:
      resources:
        limits:
          memory: 1536m
    logging: *logging

  # One-shot, once per release, before (re)starting app:  docker compose ... run --rm migrate
  migrate:
    image: *app-image
    profiles: ["tools"]
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
    env_file:
      - path: ../.env.production
        required: false
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  caddy:
    image: caddy:2.11.4
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env.production}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_started
    networks: [edge]
    deploy:
      resources:
        limits:
          memory: 256m
    logging: *logging

networks:
  # No external connectivity: db, stt, tts (and the app/ollama legs that talk to them).
  internal:
    internal: true
  # Normal bridge: Caddy (ACME + clients), app egress to Gemini, ollama model pulls.
  edge: {}

volumes:
  db-data:
  ollama-models:
  app-storage:
  caddy-data:
  caddy-config:
